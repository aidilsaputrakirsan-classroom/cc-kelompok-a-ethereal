upstream auth_service {
    server auth-service:8001;
}

upstream item_service {
    server item-service:8002;
}

server {
    listen 80;
    server_name localhost;

    # Auth Service routes
    location /auth/ {
        proxy_pass http://auth_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    # Task Service routes
    location /tasks {
        # Gunakan proxy_pass tanpa slash di akhir agar path /tasks/{id} diteruskan utuh
        proxy_pass http://item_service; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        
        # Pastikan header ini ada agar metode PUT diteruskan
        proxy_set_header Content-Type $http_content_type;
    }

    # Health check aggregator
    location /health {
        default_type application/json;
        return 200 '{"status": "healthy", "service": "gateway"}';
    }

    # Frontend (static files)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
