name: Deploy Pipeline

on:
  workflow_run:
    workflows: ["CD Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  deploy-health-check:
    name: 🏥 Deploy & Health Check
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 5
    env:
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://kelarin.up.railway.app/health' }}
    steps:
      - name: 🏥 Automated Production Health Check
        run: |
          echo "Checking Railway deployment health status..."
          HEALTH_URL="${{ env.HEALTH_URL }}"
          echo "Target Health URL: $HEALTH_URL"
          
          # Polling Pintar: Cek setiap 10 detik, maksimal 5 menit (30 kali percobaan)
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
            if [ "$HTTP_STATUS" == "200" ]; then
              echo "✅ Health check passed! Production app is healthy (HTTP $HTTP_STATUS)."
              exit 0
            fi
            echo "Waiting for Railway deployment... HTTP Status: $HTTP_STATUS (Attempt $i/30)"
            sleep 10
          done
          
          echo "❌ Health check FAILED! Application failed to return HTTP 200 after 5 minutes."
          exit 1

      - name: 🕒 Set Timestamp
        if: success()
        id: info
        run: echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      - name: 📊 Write Success Summary
        if: success()
        run: |
          echo "### 🚀 Deployment Berhasil!" >> $GITHUB_STEP_SUMMARY
          echo "Halo tim **Ethereal**, aplikasi telah berhasil dideploy ke produksi dan lolos automated health check." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Detail Deployment:**" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** https://cc-kelompok-a-ethereal-production.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend URL:** https://kelarin.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** ${{ steps.info.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY

      - name: 📊 Write Failure Summary
        if: failure()
        run: |
          echo "### ⚠️ Deployment Gagal!" >> $GITHUB_STEP_SUMMARY
          echo "Halo tim **Ethereal**, sistem mendeteksi kegagalan pada health check pasca-deployment di produksi." >> $GITHUB_STEP_SUMMARY
          echo "Kemungkinan terjadi crash loop atau kegagalan startup pada container Railway." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Silakan cek langsung ke Railway Dashboard untuk melihat log container." >> $GITHUB_STEP_SUMMARY
