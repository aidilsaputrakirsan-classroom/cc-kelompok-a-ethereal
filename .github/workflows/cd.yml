name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  build-docker:
    name: 🐳 Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - service: frontend
            context: ./frontend
          - service: auth-service
            context: ./services/auth-service
          - service: task-service
            context: ./services/task-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: false
          tags: kelarin-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  integration-test:
    name: 🔄 Integration Test
    runs-on: ubuntu-latest
    needs: [build-docker]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Verify Docker Compose Config
        run: docker compose config

      - name: 🚀 Spin up services
        run: docker compose up -d

      - name: ⏳ Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          # Max wait 2 minutes
          for i in {1..24}; do
            if [ $(docker ps | grep "(healthy)" | wc -l) -ge 4 ]; then
              echo "✅ All services are healthy!"
              exit 0
            fi
            echo "Waiting... ($((i*5))s)"
            sleep 5
          done
          echo "❌ Services failed to become healthy in time."
          docker ps
          docker compose logs
          exit 1
          
      - name: 🧪 Run Integration Tests
        run: |
          # Run tests against running environment
          echo "Executing cross-service health checks..."
          curl -f http://localhost:8000/health || echo "Backend health check failed"
          curl -f http://localhost:8001/health || echo "Auth service health check failed"
          curl -f http://localhost:8002/health || echo "Task service health check failed"

      - name: 🛑 Shut down services
        if: always()
        run: docker compose down
