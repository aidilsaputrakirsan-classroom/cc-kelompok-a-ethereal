# ==============================================
# CI Pipeline — Team Ethereal (Kelarin Project)
# ==============================================
name: CI Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read

jobs:
  # =============================================================
  # JOB: Linting (Tugas Lead CI/CD - Ruff Linter)
  # =============================================================
  lint:
    name: 🔍 Lint All Services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run linter on auth-service
        run: ruff check services/auth-service/ --ignore E999 || echo "Auth service directory not found or empty"
      - name: Run linter on task-service
        run: ruff check services/task-service/ --ignore E999 || echo "Task service directory not found or empty"

  # =============================================================
  # JOB: Unit Tests (Matrix Strategy from Main)
  # =============================================================
  test-services:
    name: 🧪 Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            path: ./services/auth-service
            runtime: python
          - service: task-service
            path: ./services/task-service
            runtime: python
          - service: frontend
            path: ./frontend
            runtime: node
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Python Logic
      - name: Setup Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: '${{ matrix.path }}/requirements.txt'

      - name: Install Backend Deps
        if: matrix.runtime == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      - name: Run Python Tests
        if: matrix.runtime == 'python'
        working-directory: ${{ matrix.path }}
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: "kelarin_secret_key_untuk_testing_doang"
        run: pytest --cov=. --cov-report=term-missing

      # Node.js Logic
      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: '${{ matrix.path }}/package-lock.json'

      - name: Install Frontend Deps
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Build Frontend
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

      - name: Run Frontend Tests
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.path }}
        run: npm test -- --passWithNoTests

  # =========================================================================
  # JOB: Integration Tests (Lead CI/CD - Week 13 with Log Artifacts)
  # =========================================================================
  integration-test:
    name: 🔄 Integration Test
    runs-on: ubuntu-latest
    needs: [test-services]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Build docker images
        run: docker compose build

      - name: 🚀 Spin up services
        run: docker compose up -d

      - name: ⏳ Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."
          # Max wait 2 minutes
          for i in {1..24}; do
            if [ $(docker ps | grep "(healthy)" | wc -l) -ge 4 ]; then
              echo "✅ All services are healthy!"
              exit 0
            fi
            echo "Waiting... ($((i*5))s)"
            sleep 5
          done
          echo "❌ Services failed to become healthy in time."
          docker ps
          docker compose logs
          exit 1

      - name: 🧪 Run Integration Tests
        run: |
          docker compose exec -T -e AUTH_SERVICE_URL=http://auth-service:8001 -e TASK_SERVICE_URL=http://task-service:8002 task-service pytest integration_tests/

      - name: 📋 Export Docker Logs
        if: always()
        run: |
          mkdir -p logs
          docker compose logs > logs/docker-services.log

      - name: 📤 Upload Docker Logs as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-services-log
          path: logs/docker-services.log
          retention-days: 7

      - name: 🛑 Shut down services
        if: always()
        run: docker compose down

  # -------------------------------------------------------------------------
  # OPTIMASI: Notifikasi PR Comment saat CI Gagal
  # -------------------------------------------------------------------------
  notify-failure:
    name: 📢 Notify Failure
    runs-on: ubuntu-latest
    needs: [lint, test-services, integration-test]
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: 💬 Leave PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ⚠️ **CI Pipeline Gagal!** ⚠️
            Halo tim **Ethereal**, pemeriksaan otomatis mendeteksi kegagalan pada tahap linting, unit testing, atau integration test.
            Mohon cek detail log di tab **[Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})** untuk perbaikan.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # TUGAS: Notifikasi PR Comment saat CI Sukses
  # -------------------------------------------------------------------------
  notify-success:
    name: 🧪 Notify Success
    runs-on: ubuntu-latest
    needs: [integration-test]
    if: success() && github.event_name == 'pull_request'
    steps:
      - name: 💬 Leave Success Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### ✅ CI Pipeline Sukses!
            Halo tim **Ethereal**, semua tahapan pemeriksaan otomatis (linting, unit tests, dan integration tests) telah berhasil lolos! 

            Langkah berikutnya:
            - Anda dapat melakukan merge PR ini ke `main` jika review manual sudah disetujui.
            - Pipeline Deployment (CD) akan otomatis dipicu setelah kode di-merge ke branch `main`.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
