name: Multi-Service CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main

jobs:
  # Job untuk validasi kode (Linting & Testing)
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Menentukan service yang akan diproses secara paralel
        include:
          - service: backend
            path: ./backend
            runtime: python
          - service: frontend
            path: ./frontend
            runtime: node

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Logika Spesifik untuk Backend (Python)
      - name: Setup Python
        if: matrix.runtime == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: Install Backend Deps
        if: matrix.runtime == 'python'
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Tests
        if: matrix.runtime == 'python'
        working-directory: ${{ matrix.path }}
        env:
          SECRET_KEY: testsecret
          ALGORITHM: HS256
        run: pytest

      # Logika Spesifik untuk Frontend (Node.js)
      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Deps
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.path }}
        run: npm ci

      - name: Build Frontend
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.path }}
        run: npm run build --if-present

      - name: Run Frontend Tests
        if: matrix.runtime == 'node'
        working-directory: ${{ matrix.path }}
        run: npm test -- --passWithNoTests
