# ==============================================
# CI Pipeline — Team Ethereal (Kelarin Project)
# ==============================================
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -------------------------------------------------------------------------
# OPTIMASI 1: Concurrency (Membatalkan proses lama jika ada push baru)
# -------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# -------------------------------------------------------------------------
# PERBAIKAN: Permissions (Wajib ada agar bot bisa menulis komentar di PR)
# -------------------------------------------------------------------------
permissions:
  pull-requests: write
  contents: read

jobs:
  # =============================================================
  # JOB: Linting (Tugas Lead CI/CD - Ruff Linter)
  # =============================================================
  lint:
    name: 🔍 Lint Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run linter
        run: ruff check backend/

  # ================================
  # JOB 1: Test Backend (FastAPI)
  # ================================
  test-backend:
    name: 🐍 Test Backend
    runs-on: ubuntu-latest
    needs: [lint] # Menunggu linter selesai (wajib pass)
    timeout-minutes: 10 # OPTIMASI 2: Timeout per job
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: "kelarin_secret_key_untuk_testing_doang"
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📥 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests
        # Lead DevOps mengaktifkan coverage report untuk monitoring target >= 60%
        run: pytest --cov=. --cov-report=term-missing

  # ================================
  # JOB 2: Test Frontend (React)
  # ================================
  test-frontend:
    name: ⚛️ Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10 # OPTIMASI 2: Timeout per job
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏗️ Build frontend
        run: npm run build

  # ================================
  # JOB 3: Build Docker Images
  # ================================
  build-docker:
    name: 🐳 Build Docker
    runs-on: ubuntu-latest
    timeout-minutes: 10 # OPTIMASI 2: Timeout per job
    needs: [test-backend, test-frontend] 
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Build Kelarin Backend Image
        run: docker build -t kelarin-backend:ci ./backend

      - name: 🐳 Build Kelarin Frontend Image
        run: docker build -t kelarin-frontend:ci ./frontend

  # =========================================================================
  # JOB 4: Automated Production Health Check (Tugas Lead DevOps - Tugas 11)
  # =========================================================================
  deploy-health-check:
    name: 🏥 Deploy & Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Menunggu proses build docker lokal selesai sebelum memverifikasi versi deploy cloud
    needs: [build-docker]
    steps:
      - name: 🏥 Automated Production Health Check
        run: |
          echo "Waiting for Railway deployment to be ready..."
          # Memberikan jeda 30 detik agar container selesai cold start di produksi
          sleep 30
          
          HEALTH_URL="https://kelarin.up.railway.app/health"
          echo "Checking health status via: $HEALTH_URL"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL)
          
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Health check passed! Production app is healthy (HTTP $HTTP_STATUS)."
          else
            echo "❌ Health check FAILED! Server returned HTTP $HTTP_STATUS."
            echo "Deployment might be crash looping. Check Railway dashboard logs immediately."
            exit 1
          fi

  # -------------------------------------------------------------------------
  # OPTIMASI 3: Notifikasi PR Comment saat CI Gagal
  # -------------------------------------------------------------------------
  notify-failure:
    name: 📢 Notify Failure
    runs-on: ubuntu-latest
    # PERBAIKAN DEVOPS: Tambahkan deploy-health-check ke daftar pantauan kegagalan
    needs: [lint, test-backend, test-frontend, build-docker, deploy-health-check]
    # Hanya jalan jika ada yang fail DAN ini adalah Pull Request
    if: failure() && github.event_name == 'pull_request'
    steps:
      - name: 💬 Leave PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ⚠️ **CI Pipeline Gagal!** ⚠️
            Halo tim **Ethereal**, pemeriksaan otomatis mendeteksi kegagalan pada tahap testing, build, atau health check produksi.
            Mohon cek detail log di tab **[Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})** untuk perbaikan.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # TUGAS: Notifikasi Deployment Berhasil (Lead CI/CD - Week 11 Revised)
  # -------------------------------------------------------------------------
  notify-success:
    name: 🚀 Notify Success
    runs-on: ubuntu-latest
    needs: [deploy-health-check]
    if: success() && github.event_name == 'pull_request'
    steps:
      - name: 🕒 Set Timestamp
        id: info
        run: echo "timestamp=$(date '+%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

      - name: 🚀 Leave Deployment Summary Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          message: |
            ### 🚀 Deployment Berhasil!
            Halo tim **Ethereal**, aplikasi telah berhasil dideploy dan melewati health check.

            **Detail Deployment:**
            - **Frontend URL:** [https://cc-kelompok-a-ethereal-production.up.railway.app](https://cc-kelompok-a-ethereal-production.up.railway.app)
            - **Backend URL:** [https://kelarin.up.railway.app](https://kelarin.up.railway.app)
            - **Commit SHA:** `${{ github.sha }}`
            - **Timestamp:** `${{ steps.info.outputs.timestamp }}`

            Cek detail log di tab **[Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})**.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Add Job Summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend URL:** https://cc-kelompok-a-ethereal-production.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend URL:** https://kelarin.up.railway.app" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp:** ${{ steps.info.outputs.timestamp }}" >> $GITHUB_STEP_SUMMARY