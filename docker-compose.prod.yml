# ============================================================
# Production Overrides — Kelarin App (Team Ethereal)
# ============================================================

services:
  # ==================== DATABASES ====================
  auth-db:
    restart: always
  
  task-db:
    restart: always

  # ==================== BACKEND SERVICES ====================
  auth-service:
    restart: always
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://kelarin.up.railway.app

  task-service:
    restart: always
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://kelarin.up.railway.app

  # ==================== FRONTEND ====================
  frontend:
    restart: always

  # ==================== GATEWAY ====================
  gateway:
    restart: always
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    environment:
      - AUTH_SERVICE_URL=http://kelarin-auth-service.railway.internal:8001
      - TASK_SERVICE_URL=http://kelarin-task-service.railway.internal:8002
      - FRONTEND_URL=http://kelarin-frontend.railway.internal:80