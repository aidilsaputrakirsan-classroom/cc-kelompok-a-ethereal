# ============================================================
# Production Overrides — Kelarin App (Team Ethereal)
# ============================================================

services:
  # ==================== DATABASES ====================
  auth-db:
    restart: always
  
  task-db:
    restart: always

  # ==================== BACKEND SERVICES ====================
  auth-service:
    restart: always
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://kelarin.up.railway.app

  task-service:
    restart: always
    environment:
      - DEBUG=false
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=https://kelarin.up.railway.app

  # ==================== FRONTEND ====================
  frontend:
    restart: always

  # ==================== GATEWAY ====================
  gateway:
    restart: always
    ports:
      - "80:80"
      - "443:443"