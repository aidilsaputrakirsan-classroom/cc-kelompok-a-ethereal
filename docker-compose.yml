services:
  # ==================== DATABASES ====================
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db-kelarin
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpg
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - kelarin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  task-db:
    image: postgres:16-alpine
    container_name: task-db-kelarin
    restart: unless-stopped
    environment:
      POSTGRES_DB: item_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpg
    volumes:
      - item_db_data:/var/lib/postgresql/data
    networks:
      - kelarin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d item_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ==================== BACKEND SERVICES ====================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:pgpg@auth-db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:-30a3199c2825ae46bf71a34324fe9cc21f438d8a07f04d3a7aa8c7948f36a337}
      CORS_ORIGINS: "http://localhost,http://localhost:5173"
    networks:
      - kelarin-net
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  task-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: task-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:pgpg@task-db:5432/item_db
      AUTH_SERVICE_URL: http://auth-service:8001
      CORS_ORIGINS: "http://localhost,http://localhost:5173"
    networks:
      - kelarin-net
    depends_on:
      task-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost

    container_name: frontend-kelarin
    restart: unless-stopped

    ports:
      - "5173:80"

    environment:
      VITE_API_URL: http://localhost

    networks:
      - kelarin-net

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # ==================== API GATEWAY ====================
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: gateway-service
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      TASK_SERVICE_URL: http://task-service:8002
      FRONTEND_URL: http://frontend:80
    networks:
      - kelarin-net
    depends_on:
      auth-service:
        condition: service_started
      task-service:
        condition: service_started
      frontend:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

# ==================== VOLUMES & NETWORKS ====================
volumes:
  auth_db_data:
    name: kelarin-auth-dbdata
  item_db_data:
    name: kelarin-task-dbdata

networks:
  kelarin-net:
    name: kelarin-net
    driver: bridge