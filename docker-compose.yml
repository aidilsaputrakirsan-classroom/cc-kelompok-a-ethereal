# ============================================================
# Docker Compose — Kelarin App (Team Ethereal)
# ============================================================

services:
  # ==================== DATABASE ====================
  db:
    image: postgres:16-alpine
    container_name: db-kelarin
    restart: unless-stopped
    profiles: ["dev", "prod"]  # Muncul di kedua profil
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpg}
      POSTGRES_DB: ${POSTGRES_DB:-kelarin}
    ports:
      - "${POSTGRES_PORT_EXTERNAL:-5433}:${POSTGRES_PORT_INTERNAL:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - kelarin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kelarin}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: dwialsha/kelarin:backend-v2
    container_name: backend
    restart: unless-stopped
    profiles: ["dev", "prod"]  # Muncul di kedua profil
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:pgpg@db:5432/kelarin}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - kelarin-net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: dwialsha/kelarin:frontend-v1
    container_name: frontend
    restart: unless-stopped
    profiles: ["dev"]  # Frontend biasanya hanya jalan di profil dev untuk tim
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - kelarin-net
    depends_on:
      - backend

# ==================== VOLUMES ====================
volumes:
  pgdata:
    name: kelarin-pgdata

# ==================== NETWORKS ====================
networks:
  kelarin-net:
    name: kelarin-net
    driver: bridge