# ============================================================
# Docker Compose — Kelarin Microservices App (Team Ethereal)
# Task Terstruktur Modul 13: Resilience & Resource Limits
# ============================================================

services:
  # ==================== DATABASES ====================
  auth-db:
    image: postgres:16-alpine
    container_name: auth-db-kelarin
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpg
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    networks:
      - kelarin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  item-db:
    image: postgres:16-alpine
    container_name: item-db-kelarin
    restart: unless-stopped
    environment:
      POSTGRES_DB: item_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpg
    volumes:
      - item_db_data:/var/lib/postgresql/data
    networks:
      - kelarin-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d item_db"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ==================== BACKEND SERVICES ====================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:pgpg@auth-db:5432/auth_db
      SECRET_KEY: ${SECRET_KEY:-30a3199c2825ae46bf71a34324fe9cc21f438d8a07f04d3a7aa8c7948f36a337}
      CORS_ORIGINS: "http://localhost,http://localhost:5173"
    networks:
      - kelarin-net
    depends_on:
      auth-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  item-service:
    build:
      context: ./services/task-service
      dockerfile: Dockerfile
    container_name: item-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:pgpg@item-db:5432/item_db
      # FIX SINKRONISASI: Diarahkan ke domain internal container, bukan localhost/host luar lagi
      AUTH_SERVICE_URL: http://auth-service:8001
      CORS_ORIGINS: "http://localhost,http://localhost:5173"
    networks:
      - kelarin-net
    depends_on:
      item-db:
        condition: service_healthy
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-kelarin
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost
    networks:
      - kelarin-net
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # ==================== API GATEWAY ====================
  gateway:
    image: nginx:alpine
    container_name: gateway-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - kelarin-net
    depends_on:
      auth-service:
        condition: service_started
      item-service:
        condition: service_started
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

# ==================== VOLUMES & NETWORKS ====================
volumes:
  auth_db_data:
    name: kelarin-auth-dbdata
  item_db_data:
    name: kelarin-item-dbdata

networks:
  kelarin-net:
    name: kelarin-net
    driver: bridge